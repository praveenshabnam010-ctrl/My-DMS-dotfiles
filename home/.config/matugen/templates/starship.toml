# Wallpaper-derived Starship theme.
# Auto-generated by DankMaterialShell matugen - do not edit manually.
"$schema" = 'https://starship.rs/config-schema.json'
palette = "dms"

format = """
[░▒▓](fg:primary)\
$os\
[](bg:primary_container fg:primary)\
$directory\
[](bg:secondary_container fg:primary_container)\
$git_branch\
$git_status\
[](bg:surface_container_high fg:secondary_container)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](bg:surface_container fg:surface_container_high)\
$time\
[ ](fg:surface_container)\
\n$character"""

[directory]
style = "fg:on_primary_container bg:primary_container"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol $branch ](fg:on_secondary_container bg:secondary_container)]($style)'

[git_status]
style = "bg:secondary_container"
format = '[[($all_status$ahead_behind )](fg:on_secondary_container bg:secondary_container)]($style)'

[nodejs]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[bun]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[rust]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[golang]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[php]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface_container"
format = '[[  $time ](fg:on_surface_variant bg:surface_container)]($style)'

[os]
style = "bg:primary fg:on_primary"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[palettes.dms]
primary = '{{colors.primary.default.hex}}'
on_primary = '{{colors.on_primary.default.hex}}'
primary_container = '{{colors.primary_container.default.hex}}'
on_primary_container = '{{colors.on_primary_container.default.hex}}'
secondary = '{{colors.secondary.default.hex}}'
on_secondary = '{{colors.on_secondary.default.hex}}'
secondary_container = '{{colors.secondary_container.default.hex}}'
on_secondary_container = '{{colors.on_secondary_container.default.hex}}'
tertiary = '{{colors.tertiary.default.hex}}'
on_tertiary = '{{colors.on_tertiary.default.hex}}'
surface = '{{colors.surface.default.hex}}'
on_surface = '{{colors.on_surface.default.hex}}'
surface_variant = '{{colors.surface_variant.default.hex}}'
on_surface_variant = '{{colors.on_surface_variant.default.hex}}'
surface_container_lowest = '{{colors.surface_container_lowest.default.hex}}'
surface_container_low = '{{colors.surface_container_low.default.hex}}'
surface_container = '{{colors.surface_container.default.hex}}'
surface_container_high = '{{colors.surface_container_high.default.hex}}'
surface_container_highest = '{{colors.surface_container_highest.default.hex}}'
outline = '{{colors.outline.default.hex}}'
error = '{{colors.error.default.hex}}'
on_error = '{{colors.on_error.default.hex}}'
