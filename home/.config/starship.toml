# Wallpaper-derived Starship theme.
# Auto-generated by DankMaterialShell matugen - do not edit manually.
"$schema" = 'https://starship.rs/config-schema.json'
palette = "dms"

format = """
[░▒▓](fg:primary)\
$os\
[](bg:primary_container fg:primary)\
$directory\
[](bg:secondary_container fg:primary_container)\
$git_branch\
$git_status\
[](bg:surface_container_high fg:secondary_container)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](bg:surface_container fg:surface_container_high)\
$time\
[ ](fg:surface_container)\
\n$character"""

[directory]
style = "fg:on_primary_container bg:primary_container"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:secondary_container"
format = '[[ $symbol $branch ](fg:on_secondary_container bg:secondary_container)]($style)'

[git_status]
style = "bg:secondary_container"
format = '[[($all_status$ahead_behind )](fg:on_secondary_container bg:secondary_container)]($style)'

[nodejs]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[bun]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[rust]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[golang]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[php]
symbol = ""
style = "bg:surface_container_high"
format = '[[ $symbol ($version) ](fg:primary bg:surface_container_high)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface_container"
format = '[[  $time ](fg:on_surface_variant bg:surface_container)]($style)'

[os]
style = "bg:primary fg:on_primary"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[palettes.dms]
primary = '#ffb4a9'
on_primary = '#690002'
primary_container = '#930003'
on_primary_container = '#ffdad5'
secondary = '#f4ba9f'
on_secondary = '#4b2714'
secondary_container = '#653d28'
on_secondary_container = '#ffdbcc'
tertiary = '#f9ba81'
on_tertiary = '#4b2700'
surface = '#1e100e'
on_surface = '#f9dcd8'
surface_variant = '#55423f'
on_surface_variant = '#dcc0bc'
surface_container_lowest = '#180b09'
surface_container_low = '#271816'
surface_container = '#2b1c19'
surface_container_high = '#372623'
surface_container_highest = '#42312e'
outline = '#a38b88'
error = '#ffb4ab'
on_error = '#690005'
